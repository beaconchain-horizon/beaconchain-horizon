<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Independent Verification — Beaconchain Horizon</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.verif-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-top: 16px; }
.verif-box label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.verif-box input, .verif-box textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px; color: var(--fg); font-family: monospace; font-size: 13px; margin-bottom: 14px; }
.verif-box textarea { min-height: 80px; resize: vertical; }
.verif-box button { background: var(--accent); color: var(--bg); border: none; padding: 10px 20px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 14px; }
.verif-box button:hover { background: var(--accent2); }
.result { margin-top: 16px; padding: 14px; border-radius: 6px; font-family: monospace; font-size: 13px; }
.result.ok { background: rgba(126,231,135,0.1); border: 1px solid var(--accent); color: var(--accent); }
.result.err { background: rgba(248,81,73,0.1); border: 1px solid #f85149; color: #f85149; }
.result.info { background: rgba(88,166,255,0.1); border: 1px solid var(--accent2); color: var(--accent2); }
</style>
</head>
<body>

<nav>
  <div class="brand">🔭 BEACONCHAIN HORIZON</div>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="monitor.html">Monitor</a></li>
    <li><a href="news.html">News</a></li>
    <li><a href="verify.html">Verify</a></li>
    <li><a href="https://github.com/beaconchain-horizon" target="_blank">GitHub</a></li>
  </ul>
</nav>

<section>
  <h2>Independent Verification</h2>
  <p style="color:var(--muted);margin-bottom:20px;">Verify any block, transaction, or signature without trusting the vendor. All data is fetched live from the local ledger API.</p>

  <div class="verif-box">
    <label>Block Number</label>
    <input type="number" id="blockNum" placeholder="e.g. 1" min="0">
    <button onclick="verifyBlock()">Fetch Block</button>
    <div id="blockResult" class="result" style="display:none;"></div>
  </div>

  <div class="verif-box">
    <label>Live Chain Info</label>
    <button onclick="loadChainInfo()">Fetch /api/v1/chain/info</button>
    <div id="chainResult" class="result" style="display:none;"></div>
  </div>

  <div class="verif-box">
    <label>Node Law Hash (all 7 verifiers must return identical)</label>
    <button onclick="checkLaw()">Check All 7 Nodes</button>
    <div id="lawResult" class="result" style="display:none;"></div>
  </div>

</section>

<script>
const BE = "http://localhost:8080";

async function verifyBlock() {
  const n = document.getElementById("blockNum").value;
  const el = document.getElementById("blockResult");
  el.style.display = "block";
  el.className = "result info";
  el.textContent = "Fetching block " + n + "...";
  try {
    const r = await fetch(BE + "/api/v1/blocks/" + n);
    const j = await r.json();
    el.className = "result ok";
    el.textContent = JSON.stringify(j, null, 2);
  } catch (e) {
    el.className = "result err";
    el.textContent = "Error: " + e.message;
  }
}

async function loadChainInfo() {
  const el = document.getElementById("chainResult");
  el.style.display = "block";
  el.className = "result info";
  el.textContent = "Fetching chain info...";
  try {
    const r = await fetch(BE + "/api/v1/chain/info");
    const j = await r.json();
    el.className = "result ok";
    el.textContent = JSON.stringify(j, null, 2);
  } catch (e) {
    el.className = "result err";
    el.textContent = "Error: " + e.message;
  }
}

async function checkLaw() {
  const el = document.getElementById("lawResult");
  el.style.display = "block";
  el.className = "result info";
  el.textContent = "Checking 7 nodes...";
  const ports = [9001, 9002, 9003, 9004, 9005, 9006, 9007];
  const results = [];
  for (const p of ports) {
    try {
      const r = await fetch("http://localhost:" + p + "/health");
      const j = await r.json();
      results.push({ port: p, role: j.role, hash: j.law_hash.slice(0, 16) });
    } catch (e) {
      results.push({ port: p, error: e.message });
    }
  }
  const uniq = [...new Set(results.filter(r => r.hash).map(r => r.hash))];
  if (uniq.length === 1 && results.length === 7) {
    el.className = "result ok";
    el.textContent = "CONSISTENT — all 7 nodes report identical law hash:\n" + uniq[0] + "\n\n" + JSON.stringify(results, null, 2);
  } else {
    el.className = "result err";
    el.textContent = "INCONSISTENT or missing nodes:\n" + JSON.stringify(results, null, 2);
  }
}
</script>

<footer>
  <p>© 2026 Beaconchain Horizon · Independent Verification</p>
</footer>

</body>
</html>
